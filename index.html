function todayStr(){
  const d=new Date(),off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
function fmtRp(n){return "Rp"+Math.round(Number(n)||0).toLocaleString("id-ID");}
function fmtDate(iso){
  if(!iso)return"";
  const[y,m,d]=iso.split("-");
  return`${d} ${"Jan Feb Mar Apr Mei Jun Jul Agu Sep Okt Nov Des".split(" ")[+m-1]} ${y}`;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function menuPrice(item,vLabel){
  if(item.variants)return item.variants.find(v=>v.label===vLabel)?.price??0;
  return item.price;
}
function ls(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSave(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

// Parse CSV teks → array objek santri
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length < 2) return [];
  const headers = lines[0].split(",").map(h=>h.replace(/"/g,"").trim().toLowerCase());
  const iNo   = headers.findIndex(h=>h==="no"||h==="#");
  const iNama = headers.findIndex(h=>h.includes("nama"));
  const iKamar= headers.findIndex(h=>h.includes("kamar"));
  const iKelas= headers.findIndex(h=>h.includes("kelas")||h.includes("klas"));
  if(iNama<0||iKamar<0||iKelas<0) return null; // header tidak ditemukan
  return lines.slice(1)
    .map(l=>l.split(",").map(c=>c.replace(/"/g,"").trim()))
    .filter(cols=>cols[iNama])
    .map(cols=>({
      id: uid(),
      nama:  cols[iNama]  ||"",
      kamar: cols[iKamar] ||"",
      kelas: cols[iKelas] ||"",
    }));
}

const TABS=[
  {key:"input",   label:"Input Pesanan",  ic:"cart"},
  {key:"rekap",   label:"Rekap Harian",   ic:"calendar"},
  {key:"laporan", label:"Laporan Pemilik",ic:"users"},
  {key:"santri",  label:"Data Santri",    ic:"usercheck"},

// ═══════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════
function App(){
  const [menu,      setMenu]      = useState(()=>ls("sahur_menu", DEFAULT_MENU));
  const [orders,    setOrders]    = useState(()=>ls("sahur_orders", []));
  const [santri,    setSantri]    = useState([]); // dari Google Sheets, tidak di-cache
  const SHEETS_DEFAULT = "https://script.google.com/macros/s/AKfycbyjmJ0GfxRe7oxUyTQAyqC4M43h0VBZy4-j31m3gqxAlek-0PkIg7df-gQzbPbuyabX/exec";
  const [sheetsUrl, setSheetsUrl] = useState(()=>ls("sahur_sheets_url", SHEETS_DEFAULT));
  const [sheetsSt,  setSheetsSt] = useState("idle"); // idle | loading | ok | err
  const [sheetMsg,  setSheetMsg] = useState("");
  const [tab,       setTab]      = useState("input");
  const [toast,     setToast]    = useState(null);

  const showToast=useCallback((msg,type="ok")=>{
    setToast({msg,type}); setTimeout(()=>setToast(null),2800);
  },[]);

  const saveMenu  =useCallback(n=>{setMenu(n);   lsSave("sahur_menu",n);},[]);
  const saveOrders=useCallback(n=>{setOrders(n); lsSave("sahur_orders",n);},[]);

  // Simpan URL Sheets
  const saveUrl=useCallback(url=>{
    setSheetsUrl(url); lsSave("sahur_sheets_url",url);
  },[]);

  // Fetch dari Google Sheets CSV
  const fetchSheets=useCallback(async(urlOverride)=>{
    const url=urlOverride!==undefined?urlOverride:sheetsUrl;
    if(!url.trim()){setSheetsSt("idle");setSantri([]);return;}
    setSheetsSt("loading"); setSheetMsg("Mengambil data santri…");
    try{
      // GAS URL — fetch langsung, tidak perlu proxy CORS
      const res = await fetch(url, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text = await res.text();
      if(!text || text.trim().length < 5) throw new Error("Data kosong");
      const parsed=parseCSV(text);
      if(parsed===null){
        setSheetsSt("err");
        setSheetMsg("Header kolom tidak ditemukan. Pastikan ada kolom Nama, Kamar, Kelas.");
        return;
      }
      setSantri(parsed);
      setSheetsSt("ok");
      setSheetMsg(`${parsed.length} santri berhasil dimuat · ${new Date().toLocaleTimeString("id-ID")}`);
    }catch(e){
      setSheetsSt("err");
      setSheetMsg("Gagal mengambil data. Cek URL atau koneksi internet.");
    }
  },[sheetsUrl]);

  // Auto-fetch saat pertama buka jika sudah ada URL tersimpan
  useEffect(()=>{
    if(sheetsUrl) fetchSheets(sheetsUrl);
  },[]);

  const owners=useMemo(()=>Array.from(new Set(menu.map(m=>m.owner))).sort(),[menu]);

  return(
    <div className="app">
      <style>{CSS}</style>
      <div className="hdr">
        <div className="hdr-row">
          <Ic n="moon" size={20}/>
          <div>
            <div className="hdr-title">Sahur Kesantrian</div>
            <div className="hdr-sub">Pendataan pesanan · pembagian ke pemilik menu</div>
          </div>
        </div>
        <div className="tabs">
          {TABS.map(t=>(
            <button key={t.key} className={`tab ${tab===t.key?"on":""}`} onClick={()=>setTab(t.key)}>
              <Ic n={t.ic} size={13}/>{t.label}
            </button>
          ))}
        </div>
      </div>
      <div className="body">
        {tab==="input"   && <InputTab   menu={menu} orders={orders} santri={santri} sheetsSt={sheetsSt} saveOrders={saveOrders} showToast={showToast} onRefresh={()=>fetchSheets()}/>}
        {tab==="rekap"   && <RekapTab   orders={orders} saveOrders={saveOrders}/>}
        {tab==="laporan" && <LaporanTab orders={orders} owners={owners}/>}
        {tab==="santri"  && <SantriTab  santri={santri} sheetsUrl={sheetsUrl} sheetsSt={sheetsSt} sheetMsg={sheetMsg}
                              saveUrl={saveUrl} onFetch={fetchSheets} showToast={showToast}/>}
        {tab==="kelola"  && <KelolaTab  menu={menu} saveMenu={saveMenu} owners={owners} showToast={showToast}/>}
      </div>
      {toast&&<div className={`toast ${toast.type==="err"?"err":""}`}>{toast.msg}</div>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// INPUT PESANAN
// ═══════════════════════════════════════════════════════════
function InputTab({menu,orders,santri,sheetsSt,saveOrders,showToast,onRefresh}){
  const [date,  setDate]  = useState(todayStr());
  const [query, setQuery] = useState("");
  const [picked,setPicked]= useState(null);
  const [showDr,setShowDr]= useState(false);
  const [hiIdx, setHiIdx] = useState(0);
  const [cart,  setCart]  = useState([]);
  const [paid,  setPaid]  = useState(true);
  const [selId, setSelId] = useState(menu[0]?.id||"");
  const [selVar,setSelVar]= useState(menu[0]?.variants?.[0]?.label||"");
  const [qty,   setQty]   = useState(1);
  const inpRef=useRef();

  const selMenu=menu.find(m=>m.id===selId);
  useEffect(()=>{if(selMenu?.variants)setSelVar(selMenu.variants[0].label);else setSelVar("");},[selId]);

  const sugg=useMemo(()=>{
    if(!query.trim()||picked)return[];
    const q=query.toLowerCase();
    return santri.filter(s=>
      s.nama.toLowerCase().includes(q)||
      s.kamar.toLowerCase().includes(q)||
      s.kelas.toLowerCase().includes(q)
    ).slice(0,8);
  },[query,picked,santri]);

  useEffect(()=>{setHiIdx(0);setShowDr(sugg.length>0);},[sugg]);

  const pick=s=>{setPicked(s);setQuery(s.nama);setShowDr(false);};
  const clear=()=>{setPicked(null);setQuery("");inpRef.current?.focus();};

  const onKey=e=>{
    if(!showDr)return;
    if(e.key==="ArrowDown"){e.preventDefault();setHiIdx(i=>Math.min(i+1,sugg.length-1));}
    if(e.key==="ArrowUp")  {e.preventDefault();setHiIdx(i=>Math.max(i-1,0));}
    if(e.key==="Enter"&&sugg[hiIdx])pick(sugg[hiIdx]);
    if(e.key==="Escape")setShowDr(false);
  };

  const addCart=()=>{
    if(!selMenu)return;
    const price=menuPrice(selMenu,selVar);
    setCart(c=>[...c,{key:uid(),menuId:selMenu.id,name:selMenu.name,variant:selVar||null,
      owner:selMenu.owner,unitPrice:price,qty:Math.max(1,Number(qty)||1)}]);
    setQty(1);
  };

  const total=cart.reduce((s,i)=>s+i.unitPrice*i.qty,0);

  const submit=()=>{
    if(cart.length===0){showToast("Keranjang masih kosong.","err");return;}
    const customer=picked?picked.nama:query.trim();
    if(!customer){showToast("Nama pemesan belum diisi.","err");return;}
    saveOrders([...orders,{
      id:uid(), date, customer,
      kamar:picked?.kamar||"", kelas:picked?.kelas||"",
      paid, items:cart.map(({key,...r})=>r), total, createdAt:Date.now()
    }]);
    setCart([]); setPicked(null); setQuery(""); setPaid(true);
    showToast("Pesanan tersimpan ✓");
  };

    {/* Status koneksi Sheets */}
    {sheetsSt==="ok" && hasSantri &&

          {picked

               <div style={{flex:1}}>
                 <div className="cn">{picked.nama}</div>
                 <div className="cm">Kamar {picked.kamar} · {picked.kelas}</div>
               </div>
               <button className="ibtn" onClick={clear}><Ic n="x" size={13}/></button>
             </div>
            :<div className="ac-wrap">
               <div style={{position:"relative"}}>
                 <Ic n="search" size={13} style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"var(--muted)"}}/>
                 <input ref={inpRef} className="inp" style={{paddingLeft:28}}
                   placeholder={hasSantri?"Ketik nama, kamar, atau kelas…":"Nama pemesan manual"}
                   value={query} onChange={e=>setQuery(e.target.value)}
                   onKeyDown={onKey}
                   onFocus={()=>sugg.length&&setShowDr(true)}
                   onBlur={()=>setTimeout(()=>setShowDr(false),150)}/>
               </div>
               {showDr&&<div className="ac-drop">
                 {sugg.map((s,i)=>(
                   <div key={s.id} className={`ac-item ${i===hiIdx?"hi":""}`} onMouseDown={()=>pick(s)}>
                     <div className="ac-name">{s.nama}</div>
                     <div className="ac-meta">Kamar {s.kamar} · {s.kelas}</div>
                   </div>
                 ))}
               </div>}

      </div>
    </div>

    <div className="card">
      <span className="lbl">Tambah menu</span>
      <div className="row">
        <div style={{flex:2}}>
          <select className="sel" value={selId} onChange={e=>setSelId(e.target.value)}>
            {CATS.map(cat=>(
              <optgroup key={cat} label={cat}>
                {menu.filter(m=>m.category===cat).map(m=>(

            <select className="sel" value={selVar} onChange={e=>setSelVar(e.target.value)}>

      <span className="lbl">Keranjang</span>

        <input type="checkbox" checked={paid} onChange={e=>setPaid(e.target.checked)}/>

      <button className="btn btn-red" onClick={submit}><Ic n="check" size={14}/>Simpan pesanan</button>
    </div>
  </div>;
}

// REKAP HARIAN
// ═══════════════════════════════════════════════════════════
function RekapTab({orders,saveOrders}){
  const [date,setDate]=useState(todayStr());
  const day=orders.filter(o=>o.date===date);
  const totalAll =day.reduce((s,o)=>s+o.total,0);
  const totalPaid=day.filter(o=>o.paid).reduce((s,o)=>s+o.total,0);
  const perMenu={};
  day.forEach(o=>o.items.forEach(it=>{
    const k=it.name+(it.variant?` (${it.variant})`:"");
    if(!perMenu[k])perMenu[k]={qty:0,sub:0};
    perMenu[k].qty+=it.qty; perMenu[k].sub+=it.unitPrice*it.qty;
  }));
  const toggle=id=>saveOrders(orders.map(o=>o.id===id?{...o,paid:!o.paid}:o));
  const remove =id=>{if(window.confirm("Hapus pesanan ini?"))saveOrders(orders.filter(o=>o.id!==id));};

  return <div>
    <div className="card">
      <span className="lbl">Pilih tanggal</span>
      <input type="date" className="inp" value={date} onChange={e=>setDate(e.target.value)} style={{maxWidth:200}}/>
    </div>
    <div className="stat-grid">
      <div className="stat"><div className="n">{fmtRp(totalAll)}</div><div className="l">Total pesanan</div></div>
      <div className="stat"><div className="n" style={{color:"var(--ok)"}}>{fmtRp(totalPaid)}</div><div className="l">Sudah lunas</div></div>
      <div className="stat"><div className="n" style={{color:"var(--err)"}}>{fmtRp(totalAll-totalPaid)}</div><div className="l">Belum lunas</div></div>
      <div className="stat"><div className="n">{day.length}</div><div className="l">Pemesan</div></div>
    </div>
    <div className="card">
      <span className="lbl">Rekap per menu — {fmtDate(date)}</span>
      {Object.keys(perMenu).length===0
        ?<div className="empty">Belum ada pesanan di tanggal ini.</div>
        :<table className="tbl">
           <thead><tr><th>Menu</th><th>Qty</th><th>Subtotal</th></tr></thead>
           <tbody>{Object.entries(perMenu).map(([k,v])=>(
             <tr key={k}><td>{k}</td><td>{v.qty}</td><td>{fmtRp(v.sub)}</td></tr>
           ))}</tbody>
         </table>
      }
    </div>
    <div className="card">
      <span className="lbl">Daftar pesanan</span>
      {day.length===0
        ?<div className="empty">Belum ada pesanan.</div>
        :day.map(o=>(
          <div className="ord-row" key={o.id}>
            <div className="ord-head">
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{o.customer}</div>
                {(o.kamar||o.kelas)&&<div style={{margin:"3px 0"}}>
                  {o.kamar&&<span className="kamar-pill" style={{marginRight:4}}>Kamar {o.kamar}</span>}
                  {o.kelas&&<span className="kelas-pill">{o.kelas}</span>}
                </div>}
                <div style={{fontSize:12,color:"var(--muted)"}}>
                  {o.items.map(it=>`${it.name}${it.variant?` (${it.variant})`:""} x${it.qty}`).join(", ")}
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontWeight:700,fontSize:14}}>{fmtRp(o.total)}</div>
                <button className={`badge ${o.paid?"badge-ok":"badge-err"}`} onClick={()=>toggle(o.id)} style={{marginTop:4}}>
                  {o.paid?"✓ Lunas":"✗ Belum lunas"}
                </button>
              </div>
            </div>
            <div style={{textAlign:"right",marginTop:4}}>
              <button className="ibtn" onClick={()=>remove(o.id)}><Ic n="trash" size={13}/></button>
            </div>
          </div>
        ))
      }
    </div>
    <div className="card">
      <span className="lbl">Export pesanan harian</span>
      <button className="btn btn-ghost" style={{fontSize:12}} onClick={()=>{
        const blob=new Blob([JSON.stringify(day,null,2)],{type:"application/json"});
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
        a.download=`pesanan-${date}.json`; a.click();
      }}>⬇ Download rekap {fmtDate(date)}</button>
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════
// LAPORAN PEMILIK
// ═══════════════════════════════════════════════════════════
function LaporanTab({orders,owners}){
  const [mode,setMode]=useState("single");
  const [date,setDate]=useState(todayStr());
  const [from,setFrom]=useState(todayStr());
  const [to,  setTo]  =useState(todayStr());

  const filtered=orders.filter(o=>{
    if(mode==="single")return o.date===date;
    if(mode==="range") return o.date>=from&&o.date<=to;
    return true;
  });

  const byOwner={};
  owners.forEach(o=>{byOwner[o]={items:{},total:0,orders:[]};});
  filtered.forEach(o=>{
    // Kumpulkan item milik setiap owner dalam pesanan ini
    const ownerItems={};
    o.items.forEach(it=>{
      if(!byOwner[it.owner])byOwner[it.owner]={items:{},total:0,orders:[]};
      const k=it.name+(it.variant?` (${it.variant})`:"");
      if(!byOwner[it.owner].items[k])byOwner[it.owner].items[k]={qty:0,sub:0};
      byOwner[it.owner].items[k].qty+=it.qty;
      byOwner[it.owner].items[k].sub+=it.unitPrice*it.qty;
      byOwner[it.owner].total+=it.unitPrice*it.qty;
      // Kumpulkan untuk detail per santri
      if(!ownerItems[it.owner])ownerItems[it.owner]={menuItems:[],subtotal:0};
      ownerItems[it.owner].menuItems.push(it);
      ownerItems[it.owner].subtotal+=it.unitPrice*it.qty;
    });
    // Masukkan ke orders per owner
    Object.entries(ownerItems).forEach(([owner,data])=>{
      if(!byOwner[owner])byOwner[owner]={items:{},total:0,orders:[]};
      byOwner[owner].orders.push({
        customer:o.customer, kamar:o.kamar||"", kelas:o.kelas||"",
        menuItems:data.menuItems, subtotal:data.subtotal
      });
    });
  });

  const grand=filtered.reduce((s,o)=>s+o.total,0);
  const ownerList=Object.keys(byOwner).filter(o=>byOwner[o].total>0).sort((a,b)=>byOwner[b].total-byOwner[a].total);

  return <div>
    <div className="card">
      <div className="row" style={{marginBottom:8}}>
        {[["single","Satu hari"],["range","Rentang tanggal"],["all","Semua data"]].map(([k,l])=>(
          <button key={k} className={`btn ${mode===k?"btn-red":"btn-ghost"}`} onClick={()=>setMode(k)}>{l}</button>
        ))}
      </div>
      {mode==="single"&&<input type="date" className="inp" value={date} onChange={e=>setDate(e.target.value)} style={{maxWidth:200}}/>}
      {mode==="range"&&<div className="row">
        <div><span className="lbl">Dari</span><input type="date" className="inp" value={from} onChange={e=>setFrom(e.target.value)}/></div>
        <div><span className="lbl">Sampai</span><input type="date" className="inp" value={to} onChange={e=>setTo(e.target.value)}/></div>
      </div>}
    </div>
    <div className="stat-grid">
      <div className="stat"><div className="n">{fmtRp(grand)}</div><div className="l">Total keseluruhan</div></div>
      <div className="stat"><div className="n">{filtered.length}</div><div className="l">Jumlah pesanan</div></div>
      <div className="stat"><div className="n">{ownerList.length}</div><div className="l">Pemilik terjual</div></div>
    </div>
    {ownerList.length===0
      ?<div className="empty">Belum ada data untuk periode ini.</div>
      :ownerList.map(owner=>(
        <div className="own-blk" key={owner}>
          <div className="own-head">
            <span style={{fontWeight:700,fontSize:14}}>{owner}</span>
            <span style={{fontWeight:700,fontSize:14}}>{fmtRp(byOwner[owner].total)}</span>
          </div>
          {/* Tabel ringkasan */}
          <table className="tbl">
            <thead><tr><th>Menu</th><th>Qty</th><th>Subtotal</th></tr></thead>
            <tbody>{Object.entries(byOwner[owner].items).map(([k,v])=>(
              <tr key={k}><td>{k}</td><td>{v.qty}</td><td>{fmtRp(v.sub)}</td></tr>
            ))}</tbody>
          </table>
          {/* Detail per santri */}
          <div style={{borderTop:"2px dashed var(--bdr)",padding:"8px 10px",background:"#FFFDF8"}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".4px",marginBottom:6}}>
              Detail per santri
            </div>
            {byOwner[owner].orders.map((o,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",
                padding:"6px 0",borderBottom:"1px dashed #F2EAD6",fontSize:13}}>
                <div>
                  <div style={{fontWeight:700}}>{o.customer}</div>
                  {(o.kamar||o.kelas)&&<div style={{margin:"2px 0"}}>
                    {o.kamar&&<span className="kamar-pill" style={{marginRight:4}}>Kamar {o.kamar}</span>}
                    {o.kelas&&<span className="kelas-pill">{o.kelas}</span>}
                  </div>}
                  <div style={{fontSize:12,color:"var(--muted)"}}>
                    {o.menuItems.map(it=>`${it.name}${it.variant?` (${it.variant})`:""} x${it.qty}`).join(", ")}
                  </div>
                </div>
                <div style={{fontWeight:700,flexShrink:0,marginLeft:8}}>{fmtRp(o.subtotal)}</div>
              </div>
            ))}
          </div>
        </div>
      ))
    }
  </div>;
}

  const filtered=search.trim()
    ?santri.filter(s=>
        s.nama.toLowerCase().includes(search.toLowerCase())||
        s.kamar.toLowerCase().includes(search.toLowerCase())||
        s.kelas.toLowerCase().includes(search.toLowerCase()))
    :santri;

  return <div>

    {/* Panduan */}
    <div className="info-box info-blue">
      <strong>Cara menghubungkan Google Sheets:</strong><br/>
      1. Buka Google Sheets kamu<br/>
      2. Klik <strong>File → Share → Publish to web</strong><br/>
      3. Pilih sheet-nya → ubah format ke <strong>CSV</strong> → klik <strong>Publish</strong><br/>

    {/* Input URL */}
    <div className="card">
      <span className="lbl">URL Google Sheets (CSV)</span>
      <div className="sheets-url-box">
        <input className="inp" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"
          value={urlDraft} onChange={e=>setUrlDraft(e.target.value)}/>
        <button className="btn btn-red" onClick={()=>{saveUrl(urlDraft);onFetch(urlDraft);}}>
          <Ic n="link" size={13}/>Sambungkan
        </button>
      </div>
      {/* Status */}
      {sheetsSt!=="idle"&&<div style={{marginTop:8,fontSize:12.5,display:"flex",alignItems:"center",gap:6,color:statusColor[sheetsSt]}}>
        <span className={`status-dot ${statusDot[sheetsSt]}`}/>
        {sheetMsg}
      </div>}
    </div>

    {/* Tombol refresh */}
    {sheetsSt==="ok"&&
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <button className="btn btn-ghost" onClick={()=>onFetch()}>
          <Ic n="refresh" size={14}/>Refresh data santri
        </button>
      </div>
    }

    {/* Statistik */}
    <div className="stat-grid">
      <div className="stat"><div className="n">{santri.length}</div><div className="l">Total santri</div></div>
      <div className="stat"><div className="n">{Array.from(new Set(santri.map(s=>s.kamar))).length}</div><div className="l">Kamar</div></div>
      <div className="stat"><div className="n">{Array.from(new Set(santri.map(s=>s.kelas))).length}</div><div className="l">Kelas</div></div>
    </div>

    {/* Tabel */}
    <div className="card">
      <span className="lbl" style={{marginBottom:8}}>Daftar santri ({filtered.length})</span>
      {santri.length>0&&
        <div style={{position:"relative",marginBottom:10}}>
          <Ic n="search" size={13} style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"var(--muted)"}}/>
          <input className="inp" style={{paddingLeft:28}} placeholder="Cari nama, kamar, kelas…"
            value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
      }
      {santri.length===0
        ?<div className="empty">
           Belum ada data santri.<br/>
           {sheetsSt==="idle"?"Paste URL Google Sheets di atas lalu klik Sambungkan.":""}
           {sheetsSt==="loading"?"Sedang memuat…":""}
           {sheetsSt==="err"?"Koneksi gagal. Cek URL dan coba lagi.":""}
         </div>
        :<div className="tbl-scroll">
           <table className="tbl" style={{width:"100%"}}>
             <thead><tr><th>#</th><th>Nama</th><th>Kamar</th><th>Kelas</th></tr></thead>
             <tbody>{filtered.map((s,i)=>(
               <tr key={s.id}>
                 <td style={{color:"var(--muted)",fontSize:11}}>{i+1}</td>
                 <td style={{fontWeight:600}}>{s.nama}</td>

      <strong>⚠️ Cara alternatif jika tetap gagal (Google Apps Script):</strong><br/>

        {"function doGet(){var ss=SpreadsheetApp.openByUrl('GANTI_URL_SHEETS_KAMU');var s=ss.getSheets()[0];var d=s.getDataRange().getValues();return ContentService.createTextOutput(d.map(r=>r.join(',')).join('\n')).setMimeType(ContentService.MimeType.TEXT);}"}

    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════
// KELOLA MENU
// ═══════════════════════════════════════════════════════════
function KelolaTab({menu,saveMenu,owners,showToast}){
  const [draft,  setDraft]  =useState(menu);
  const [dirty,  setDirty]  =useState(false);
  const [showAdd,setShowAdd]=useState(false);
  const [newItem,setNewItem]=useState({name:"",category:"Utama",owner:owners[0]||"",price:0});

  useEffect(()=>{setDraft(menu);setDirty(false);},[menu]);

  const upd=(id,f,v)=>{setDraft(d=>d.map(m=>m.id===id?{...m,[f]:v}:m));setDirty(true);};
  const updVar=(id,lbl,v)=>{setDraft(d=>d.map(m=>m.id===id?{...m,variants:m.variants.map(x=>x.label===lbl?{...x,price:Number(v)||0}:x)}:m));setDirty(true);};
  const del=id=>{setDraft(d=>d.filter(m=>m.id!==id));setDirty(true);};
  const save=()=>{saveMenu(draft);setDirty(false);showToast("Menu tersimpan ✓");};
  const addNew=()=>{
    if(!newItem.name.trim()||!newItem.owner.trim()){showToast("Nama dan pemilik wajib diisi.","err");return;}
    setDraft(d=>[...d,{id:uid(),name:newItem.name.trim(),category:newItem.category,
      owner:newItem.owner.trim(),price:Number(newItem.price)||0}]);
    setDirty(true);setNewItem({name:"",category:"Utama",owner:owners[0]||"",price:0});setShowAdd(false);
  };

  return <div>
    {dirty&&<div className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--goldbg)",borderColor:"var(--gold)"}}>
      <span style={{fontSize:13,fontWeight:700}}>Ada perubahan belum disimpan.</span>
      <button className="btn btn-red" onClick={save}><Ic n="check" size={13}/>Simpan</button>
    </div>}

    {CATS.map(cat=>(
      <div className="card" key={cat}>
        <span className="lbl">{cat}</span>
        {draft.filter(m=>m.category===cat).map(m=>(
          <div key={m.id} style={{borderBottom:"1px dashed var(--bdr)",padding:"8px 0"}}>
            <div className="row" style={{marginBottom:m.variants?5:0}}>
              <div style={{flex:2}}><input className="inp" value={m.name} onChange={e=>upd(m.id,"name",e.target.value)}/></div>
              <div><input className="inp" list="own-list" value={m.owner} onChange={e=>upd(m.id,"owner",e.target.value)}/></div>
              {!m.variants&&<div style={{maxWidth:110}}><input type="number" className="inp" value={m.price} onChange={e=>upd(m.id,"price",Number(e.target.value)||0)}/></div>}
              <button className="ibtn" onClick={()=>del(m.id)}><Ic n="trash" size={14}/></button>
            </div>
            {m.variants&&<div className="row">
              {m.variants.map(v=>(
                <div key={v.label} style={{maxWidth:150}}>
                  <span className="lbl">{v.label}</span>
                  <input type="number" className="inp" value={v.price} onChange={e=>updVar(m.id,v.label,e.target.value)}/>
                </div>
              ))}
            </div>}
          </div>
        ))}
      </div>
    ))}

    <datalist id="own-list">{owners.map(o=><option key={o} value={o}/>)}</datalist>

    <div className="card">
      {!showAdd
        ?<button className="btn btn-ghost" onClick={()=>setShowAdd(true)}><Ic n="plus" size={14}/>Tambah menu baru</button>
        :<>
           <div className="row" style={{marginBottom:7}}>
             <div style={{flex:2}}><input className="inp" placeholder="Nama menu" value={newItem.name} onChange={e=>setNewItem(n=>({...n,name:e.target.value}))}/></div>
             <div><select className="sel" value={newItem.category} onChange={e=>setNewItem(n=>({...n,category:e.target.value}))}>
               {CATS.map(c=><option key={c} value={c}>{c}</option>)}
             </select></div>
           </div>
           <div className="row">
             <div><input className="inp" list="own-list" placeholder="Pemilik resep" value={newItem.owner} onChange={e=>setNewItem(n=>({...n,owner:e.target.value}))}/></div>
             <div style={{maxWidth:120}}><input type="number" className="inp" placeholder="Harga" value={newItem.price} onChange={e=>setNewItem(n=>({...n,price:e.target.value}))}/></div>
             <button className="btn btn-red" onClick={addNew}><Ic n="plus" size={13}/>Tambah</button>
             <button className="btn btn-ghost" onClick={()=>setShowAdd(false)}><Ic n="x" size={13}/>Batal</button>
           </div>
         </>
      }
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
